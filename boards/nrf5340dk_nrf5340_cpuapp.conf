# Don't get entropy from HCI on nRF5340 devices
CONFIG_BT_HOST_CRYPTO_PRNG=y
CONFIG_ENTROPY_BT_HCI=n

# Power: use software crypto (Oberon) only; do not enable CryptoCell hardware
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_PSA_CRYPTO_DRIVER_OBERON=y

# LFXO/32k RC: reverted - was increasing power on this design. Leave default (LFXO if enabled by board).
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
