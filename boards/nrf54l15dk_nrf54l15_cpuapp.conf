# Disable the unspupported UART0 driver
CONFIG_NRFX_UARTE0=n

# nRF54L: SPIM00 (spi00) on P2.x; CS P2.05/P2.10 via direct P2 registers.
CONFIG_GPIO=y
CONFIG_NRFX_SPIM0=y
CONFIG_SPI=n

# nRF54L bring-up: 1 = main() only toggles LED1/P2.05 (no SPI/timer). Set to n for normal app.
# Alternatively set CHRONOS_NRF54L_PIN_TEST in src/config.h.
CONFIG_CHRONOS_NRF54L_PIN_TEST=n
